services:
  - type: web
    name: edupulse-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: edupulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: OPENAI_MODEL
        value: gpt-5-mini

# Render-managed PostgreSQL. The free database is intended for development/demo use.
databases:
  - name: edupulse-db
    databaseName: edupulse
    user: edupulse
    plan: free
