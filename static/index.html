<!doctype html><html><head><meta charset="utf-8"><title>University Knowledge Assistant</title><style>body{font-family:Inter,system-ui;max-width:1000px;margin:40px auto;padding:0 20px;background:#0b1020;color:#eef}.card{padding:20px;background:#11182b;border-radius:12px;margin:15px 0}textarea,input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #445;background:#18223a;color:#fff}button{cursor:pointer}pre{white-space:pre-wrap}</style></head><body><h1>University Knowledge Assistant</h1><div class="card"><input id="title" value="Student Handbook"><textarea id="doc">The library is open Monday to Saturday from 8 AM to 8 PM. Course registration is completed through the academic portal.</textarea><button onclick="addDoc()">Index Document</button></div><div class="card"><input id="q" value="When is the library open?"><button onclick="ask()">Ask</button><pre id="out"></pre></div><script>async function addDoc(){const r=await fetch('/api/v1/documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,content:doc.value})});out.textContent=JSON.stringify(await r.json(),null,2)}async function ask(){const r=await fetch('/api/v1/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value,top_k:3})});out.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
